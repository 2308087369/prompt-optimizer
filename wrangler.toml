name = "prompt-optimizer"
compatibility_date = "2024-01-01"

[build]
command = "pnpm build"
destination = "packages/web/dist"

# 环境变量配置
[env.production.vars]
VITE_CLOUDFLARE_DEPLOYMENT = "true"

# 开发环境配置
[env.preview.vars]
VITE_CLOUDFLARE_DEPLOYMENT = "true"

# Pages配置
[pages]
# 兼容性标志
compatibility_flags = ["nodejs_compat"]

# 函数配置（如果需要处理API路由）
[[pages.functions]]
routing = "/api/*"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 重定向规则（备用配置）
[[redirects]]
from = "/api/*"
to = "/api/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200